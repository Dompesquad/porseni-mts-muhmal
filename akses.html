<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Kode Akses</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #333;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      background: #006699;
      color: #fff;
      padding: 10px;
      border: none;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #004d66;
    }
    .error {
      color: red;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Masukkan Kode Akses</h2>
    <input type="password" id="kode" placeholder="Kode Akses" required>
    <button onclick="cekKode()">Masuk</button>
    <p class="error" id="errorMsg">Kode salah!</p>
  </div>

  <script>
    const kodeBenar = "mts2025"; // Ganti sesuai kebutuhan

    function cekKode() {
      const kode = document.getElementById("kode").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (kode === kodeBenar) {
        sessionStorage.setItem("aksesDisetujui", "true");
        window.location.href = "input-nilai.html";
      } else {
        errorMsg.style.display = "block";
      }
    }
  </script>
</body>
</html>
