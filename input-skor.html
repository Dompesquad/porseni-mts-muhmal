<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Input Skor PORSENI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    nav {
      background-color: #4CAF50;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
      margin: 0 10px;
      font-size: 18px;
    }
    nav a:hover {
      background-color: #45a049;
    }
    .form-container {
      margin-top: 20px;
      padding: 20px;
      background-color: #f4f4f4;
      border-radius: 8px;
    }
    .form-container input,
    .form-container select,
    .form-container button {
      padding: 10px;
      margin: 10px 0;
      width: 100%;
      max-width: 300px;
    }
    .form-container button {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .form-container button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <!-- Menu Navigasi -->
<nav>
  <a href="index.html">Dashboard</a>
  <a href="input-nilai.html">Input Nilai Seni</a>
  <a href="input-skor.html">Input Skor Olahraga</a>
  <a href="admin-panel.html">Admin Panel</a>
</nav>


  <div class="form-container">
    <h2>Input Skor Pertandingan</h2>
    <form id="inputSkorForm">
      <label for="kelas1">Kelas 1:</label>
      <select id="kelas1" required>
        <option value="VII.1">VII.1</option>
        <option value="VII.2">VII.2</option>
        <option value="VII.3">VII.3</option>
        <option value="VIII.1">VIII.1</option>
        <option value="VIII.2">VIII.2</option>
        <option value="VIII.3">VIII.3</option>
        <option value="IX.1">IX.1</option>
        <option value="IX.2">IX.2</option>
        <option value="IX.3">IX.3</option>
      </select>

      <label for="kelas2">Kelas 2:</label>
      <select id="kelas2" required>
        <option value="VII.1">VII.1</option>
        <option value="VII.2">VII.2</option>
        <option value="VII.3">VII.3</option>
        <option value="VIII.1">VIII.1</option>
        <option value="VIII.2">VIII.2</option>
        <option value="VIII.3">VIII.3</option>
        <option value="IX.1">IX.1</option>
        <option value="IX.2">IX.2</option>
        <option value="IX.3">IX.3</option>
      </select>

      <label for="skor1">Skor Kelas 1:</label>
      <input type="number" id="skor1" required>

      <label for="skor2">Skor Kelas 2:</label>
      <input type="number" id="skor2" required>

      <button type="submit">Input Skor</button>
    </form>
  </div>

  <script>
    // Fungsi untuk menghitung poin berdasarkan hasil pertandingan
    document.getElementById("inputSkorForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const kelas1 = document.getElementById("kelas1").value;
      const kelas2 = document.getElementById("kelas2").value;
      const skor1 = parseInt(document.getElementById("skor1").value);
      const skor2 = parseInt(document.getElementById("skor2").value);

      let poinKelas1 = 0;
      let poinKelas2 = 0;

      // Tentukan pemenang dan pemberian poin
      if (skor1 > skor2) {
        poinKelas1 = 3;
        poinKelas2 = 0;
      } else if (skor2 > skor1) {
        poinKelas1 = 0;
        poinKelas2 = 3;
      } else {
        poinKelas1 = 1;
        poinKelas2 = 1;
      }

      // Simpan hasil skor ke localStorage
      let poinKelas = JSON.parse(localStorage.getItem("poinKelas")) || {};
      poinKelas[kelas1] = (poinKelas[kelas1] || 0) + poinKelas1;
      poinKelas[kelas2] = (poinKelas[kelas2] || 0) + poinKelas2;

      localStorage.setItem("poinKelas", JSON.stringify(poinKelas));

      alert(`Skor berhasil dimasukkan! ${kelas1}: ${skor1} - ${kelas2}: ${skor2}`);

      // Kosongkan form setelah submit
      document.getElementById("inputSkorForm").reset();
    });
  </script>
</body>
</html>
