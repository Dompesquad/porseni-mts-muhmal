<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Input Skor Olahraga</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 0;
    }
    nav {
      background: #006699;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .container {
      max-width: 600px;
      margin: 30px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    label {
      font-weight: bold;
      display: block;
      margin: 15px 0 5px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 3px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      background-color: #28a745;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #218838;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">🏠 Dashboard</a>
    <a href="input-nilai.html">🎨 Input Nilai Seni</a>
    <a href="input-skor.html">⚽ Input Skor Olahraga</a>
    <a href="admin-panel.html">🗂️ Admin Panel</a>
  </nav>

  <div class="container">
    <h2>Input Skor Olahraga</h2>
    <form id="formSkor">
      <label>Cabang Olahraga:</label>
      <select id="olahraga" required>
        <option value="">-- Pilih Cabang --</option>
        <option value="Futsal Putra">Futsal Putra</option>
        <option value="Bulutangkis">Bulutangkis</option>
        <option value="Sepak Takraw Putra">Sepak Takraw Putra</option>
        <option value="Voli Putra">Voli Putra</option>
        <option value="Voli Putri">Voli Putri</option>
      </select>

      <div id="bulutangkis-submenu" class="hidden">
        <label>Kategori Bulutangkis:</label>
        <select id="kategoriBulutangkis">
          <option value="Putra Solo">Putra - Solo</option>
          <option value="Putra Ganda">Putra - Ganda</option>
          <option value="Putri Solo">Putri - Solo</option>
          <option value="Putri Ganda">Putri - Ganda</option>
        </select>
      </div>

      <label>Tim A:</label>
      <input type="text" id="timA" required>

      <label>Skor Tim A:</label>
      <input type="number" id="skorA" required>

      <label>Tim B:</label>
      <input type="text" id="timB" required>

      <label>Skor Tim B:</label>
      <input type="number" id="skorB" required>

      <button type="submit">💾 Simpan Skor</button>
    </form>
  </div>

  <script>
    const olahragaSelect = document.getElementById("olahraga");
    const bulutangkisMenu = document.getElementById("bulutangkis-submenu");

    olahragaSelect.addEventListener("change", function () {
      if (this.value === "Bulutangkis") {
        bulutangkisMenu.classList.remove("hidden");
      } else {
        bulutangkisMenu.classList.add("hidden");
      }
    });

    document.getElementById("formSkor").addEventListener("submit", function(e) {
      e.preventDefault();

      const olahraga = olahragaSelect.value;
      const kategori = olahraga === "Bulutangkis" ? 
          document.getElementById("kategoriBulutangkis").value : olahraga;

      const timA = document.getElementById("timA").value;
      const skorA = parseInt(document.getElementById("skorA").value);
      const timB = document.getElementById("timB").value;
      const skorB = parseInt(document.getElementById("skorB").value);

      let hasil = "";
      if (skorA > skorB) hasil = `${timA} menang dan dapat 3 poin`;
      else if (skorA < skorB) hasil = `${timB} menang dan dapat 3 poin`;
      else hasil = `Seri, kedua tim dapat 1 poin`;

      alert(`✅ Skor Tersimpan!\nCabang: ${kategori}\n${timA} ${skorA} - ${skorB} ${timB}\n➡️ ${hasil}`);
      
      this.reset();
      bulutangkisMenu.classList.add("hidden");
    });
  </script>
</body>
</html>
