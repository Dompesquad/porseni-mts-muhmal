<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard PORSENI</title>
    <style>
        /* Styling untuk Form Kode Akses */
        .akses-form {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .akses-form input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .akses-form button {
            width: 85%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .akses-form button:hover {
            background-color: #45a049;
        }

        #dashboard {
            display: none;
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
        }

        #error {
            font-size: 14px;
            margin-top: 10px;
            color: red;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Bagian Form Kode Akses -->
    <div id="aksesForm" class="akses-form">
        <h2>Masukkan Kode Akses</h2>
        <input type="password" id="kodeAkses" placeholder="Masukkan Kode Akses">
        <button onclick="verifikasiAkses()">Masuk</button>
        <p id="error">Kode akses salah! Coba lagi.</p>
    </div>

    <!-- Bagian Dashboard -->
    <div id="dashboard">
        <h1>Dashboard PORSENI</h1>
        <p>Selamat datang di dashboard!</p>
        <!-- Konten lainnya di dashboard -->
    </div>

    <script>
        // Kode akses yang benar
        const kodeAksesValid = "123456"; // Ganti dengan kode akses yang diinginkan

        // Fungsi untuk verifikasi kode akses
        function verifikasiAkses() {
            const kodeAksesInput = document.getElementById('kodeAkses').value;
            const errorMessage = document.getElementById('error');
            
            if (kodeAksesInput === kodeAksesValid) {
                // Sembunyikan form kode akses dan tampilkan dashboard
                document.getElementById('aksesForm').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                // Tampilkan pesan error jika kode salah
                errorMessage.style.display = 'block';
            }
        }
    </script>
</body>
</html>
